name: CI

on:
  push:
    branches: [main, "factory/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify repository bootstrap
        run: make bootstrap

      - name: Run lint and tests
        run: make check

      - name: Run race checks
        run: |
          if [ -f go.mod ]; then
            go test -race ./...
          else
            echo "No go.mod yet, skipping race checks."
          fi
